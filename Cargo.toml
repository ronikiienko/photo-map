[package]
name = "photo-map"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
wgpu = "30.0.1"
winit = "0.30.13"
egui = "0.36.2"
egui-wgpu = "0.36.2"
egui-winit = "0.36.2"
glam = { version = "0.30.4", features = ["bytemuck"] }
bytemuck = { version = "1.23.1", features = ["derive"] }
pollster = "0.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memmap2 = "0.9"
image = "0.25.6"
libc = "0.2"
rayon = "1.11"
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["load-dynamic", "cuda", "tensorrt", "coreml", "std"] }
libloading = "0.9.0"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
half = "2"
onnx-protobuf = "0.2.3"
# onnx-protobuf's generated code checks for exactly this version
protobuf = "=3.4.0"
umap-rs = "0.4.5"
ndarray = { version = "0.17", features = ["rayon"] }
delaunator = "1.1.0"
rfd = "0.17"
fast_image_resize = "6.1.0"
ureq = "3"
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }
sha2 = "0.11.1"
libjpeg-turbo-rs = "0.8.0"
rusty_dds = { version = "0.9", default-features = false, features = ["encode", "decode", "simd"] }
