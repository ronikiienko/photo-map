[package]
name = "photo-map"
version = "0.1.0"
edition = "2024"

[dependencies]
wgpu = "30.0.1"
winit = "0.30.13"
egui = "0.36.2"
egui-wgpu = "0.36.2"
egui-winit = "0.36.2"
glam = { version = "0.30.4", features = ["bytemuck"] }
bytemuck = { version = "1.23.1", features = ["derive"] }
pollster = "0.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memmap2 = "0.9"
image = "0.25.6"
intel_tex_2 = "0.4"
rayon = "1.11"
rodio = { version = "0.23.0", default-features = false, features = ["playback", "symphonia-wav", "symphonia-pcm"] }
